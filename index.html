<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Minac - Loja Virtual</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Header / Cabeçalho (Limpo e Completo) -->
    <header class="site-header">
        <div class="logo-container">
            <a href="index.html">
                <img src="img/logo.jpg" width="250" alt="Logo PetShop Minac" class="site-logo">
            </a>
        </div>
        <div class="search-container">
            <input type="text" id="busca" placeholder="O que seu pet precisa hoje?" aria-label="Pesquisar produtos" oninput="filtrarPorNome(this.value)">
        </div>
        <div class="user-actions">
            <a href="#" aria-label="Minha Conta">Perfil</a>
            <a href="#" aria-label="Favoritos">❤️</a>
            <a href="carrinho.html" aria-label="Carrinho de Compras" class="cart-link">🛒 <span
                    id="cart-count">2</span></a>
        </div>
    </header>

    <!-- Banner Principal -->
    <section class="hero-banner">
        <div class="hero-content">
            <h2>Até 30% OFF</h2>
            <p>em Rações Premium e Acessórios</p>
            <button class="btn-primary">Comprar</button>
        </div>
    </section>

    <!-- Seção de Produtos -->
    <main class="container">
        <!-- Destaques -->
        <section>
            <h3 class="section-title">Destaques da Semana</h3>
            <div id="lista-produtos" class="product-grid">
            </div>
        </section>

        <!-- Filtro por Categoria (Onde a mágica do filtro por clique vai acontecer) -->
        <section class="category-section" style="margin-top: 30px;">
            <h3 class="section-title">Filtrar por Categoria</h3>
            <div class="category-grid">
                <div class="cat-card" onclick="filtrarPorCategoria('todos')">🐾 Todas</div>
                <div class="cat-card" onclick="filtrarPorCategoria('Cães')">🐶 Cães</div>
                <div class="cat-card" onclick="filtrarPorCategoria('Gatos')">🐱 Gatos</div>
                <div class="cat-card" onclick="filtrarPorCategoria('Rações')">📦 Rações</div>
                <div class="cat-card" onclick="filtrarPorCategoria('Brinquedos')">🧸 Brinquedos</div>
                <div class="cat-card" onclick="filtrarPorCategoria('Petiscos')">🍖 Petiscos</div>
                <div class="cat-card" onclick="filtrarPorCategoria('Remédios')">💊 Remédios</div>
            </div>
        </section>

        <section style="margin-top: 40px;">
            <h3 class="section-title">Todos os Produtos</h3>
            <div id="produtos-container" class="product-grid">
                <!-- carregarProdutos() que vai montar o layout aqui dentro -->
            </div>
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="site-footer">
        <ul>
            <li><a href="#">Sobre Nós</a></li>
            <li><a href="#">Política de Entrega</a></li>
            <li><a href="#">Trocas e Devoluções</a></li>
            <li><a href="#">Contato (WhatsApp)</a></li>
            <li><a href="#">Privacidade</a></li>
        </ul>
    </footer>
</body>

</html>
